id = "shadowfax.talon"
name = "Talon"
version = "0.1.0"
description = "Browse focused pane history and copy values with keyboard hints."
min_herdr_version = "0.7.5"
platforms = ["macos"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[actions]]
id = "launch"
title = "Open Talon"
description = "Browse recent focused-pane output and copy a target or selection."
contexts = ["pane"]
command = ["./target/release/herdr-talon", "launch"]

[[actions]]
id = "install-keybindings"
title = "Install Talon keybinding"
description = "Bind prefix+g to Talon in the Herdr config."
command = ["./target/release/herdr-talon", "install-keybindings"]

[[panes]]
id = "picker"
title = "Talon"
placement = "popup"
width = "90%"
height = "90%"
command = ["./target/release/herdr-talon", "picker"]
